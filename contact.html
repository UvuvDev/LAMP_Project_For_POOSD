<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COP 4331 LAMP Stack Demo</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="alternate icon" href="favicon.ico">
    <!-- Custom Styles -->
    <link href="css/styles.css" rel="stylesheet">
    <!-- Scripts -->
    <script type="text/javascript" src="js/code.js"></script>
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function() {
            readCookie();
        }, false);
    </script>
</head>
<body class="py-4 py-md-5">
    <div class="background-glow"></div>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">

                <!-- Header / User Bar -->
                <div class="d-flex flex-column flex-md-row align-items-center justify-content-between mb-4 pb-3 border-bottom border-secondary-subtle gap-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="app-icon-wrapper-sm">
                            <i class="bi bi-person-fill"></i>
                        </div>
                        <h1 id="title" class="h3 fw-bold mb-0">COP 4331 LAMP Stack</h1>
                    </div>
                    
                    <!-- Logged In User Info & Logout Button -->
                    <div id="loggedInDiv" class="d-flex align-items-center gap-3 bg-body-tertiary px-3 py-2 rounded-pill border">
                        <span id="userName" class="small fw-medium text-body"></span>
                        <button type="button" id="logoutButton" class="buttons btn btn-outline-danger btn-sm rounded-pill px-3" onclick="doLogout();">
                            <i class="bi bi-box-arrow-right me-1"></i> Log Out
                        </button>
                    </div>
                </div>

                <!-- Access UI Card -->
                <div id="accessUIDiv" class="card glass-card shadow-lg border-0 p-4 p-md-5">
                    <div class="card-body p-0">
                        <h2 class="h5 fw-bold mb-4 d-flex align-items-center gap-2 text-white">
                            <i class="bi bi-sliders text-primary"></i> Contact Manager
                        </h2>

                        <!-- Search Section -->
                        <div class="section-card p-4 rounded-4 border mb-4">
                            <label for="searchText" class="form-label form-label-contrast small text-uppercase">Search Contacts</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-search text-secondary-contrast"></i></span>
                                <input type="text" id="searchText" class="form-control" placeholder="Type a contact name (e.g. John Doe)" onkeyup="if(event.key === 'Enter') searchContacts();" />
                                <button type="button" id="searchContactButton" class="buttons btn btn-primary px-4 fw-semibold" onclick="searchContacts();">
                                    Search Contact
                                </button>
                            </div>
                            <div class="mt-3">
                                <span id="contactSearchResult" class="text-info-wcag small fw-semibold"></span>
                                <p id="contactList" class="mt-2 mb-0 d-flex flex-wrap gap-2"></p>
                            </div>
                        </div>

                        <!-- Add Contact Section -->
                        <div class="section-card p-4 rounded-4 border">
                            <label for="contactText" class="form-label form-label-contrast small text-uppercase">Add New Contact</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-plus-circle text-secondary-contrast"></i></span>
                                <input type="text" id="contactText" class="form-control" placeholder="Enter contact name to add" onkeyup="if(event.key === 'Enter') addContact();" />
                                <button type="button" id="addContactButton" class="buttons btn btn-success px-4 fw-semibold" onclick="addContact();">
                                    Add Contact
                                </button>
                            </div>
                            <div class="mt-2 text-start">
                                <span id="contactAddResult" class="small fw-semibold"></span>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
