[defaults]
inventory            = inventory/hosts.ini
roles_path           = roles
collections_path     = collections
host_key_checking    = True
retry_files_enabled  = False
# Run pending handlers even when the play fails. Without this, a mid-play error
# drops the queued "Restart apache" -- and because the config tasks are then
# idempotent, no later run re-notifies it and the vhost stays dormant forever.
force_handlers       = True
interpreter_python   = /usr/bin/python3
stdout_callback      = yaml
callbacks_enabled    = profile_tasks
display_skipped_hosts = False
forks                = 10
timeout              = 30
# Uncomment once group_vars/vault.yml is encrypted (or pass --ask-vault-pass):
# vault_password_file = ~/.ansible/lamp-vault-pass

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root

[ssh_connection]
# accept-new trusts a first-seen host key but still detects later changes.
ssh_args     = -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30
pipelining   = True
