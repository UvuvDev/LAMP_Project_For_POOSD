---
app_directories:
  - "{{ app_root }}"
  - "{{ app_docroot }}"
  - "{{ app_config_dir }}"
  # storage/ is intentionally absent -- the next task in the role creates it
  # with the web user as owner. Listing it here too made the two tasks flip
  # ownership back and forth on every run.

# Schema files are staged here -- outside app_docroot, so never web-reachable.
app_sql_dir: "{{ app_root }}/sql"
