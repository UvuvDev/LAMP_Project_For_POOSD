---
- name: Create the application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ app_group }}"
    mode: "0750"
  loop: "{{ app_directories }}"

- name: Make the writable storage directory owned by the web user
  ansible.builtin.file:
    path: "{{ app_root }}/storage"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0750"

# Credentials live outside the document root and are never world-readable.
- name: Deploy the database configuration
  ansible.builtin.template:
    src: db.php.j2
    dest: "{{ app_config_dir }}/db.php"
    owner: root
    group: "{{ app_group }}"
    mode: "0640"
  no_log: true

- name: Deploy your own application code
  ansible.posix.synchronize:
    src: "{{ app_source_dir | regex_replace('/?$', '/') }}"
    dest: "{{ app_docroot }}/"
    delete: true
    rsync_opts: "{{ (['.git', '.env'] + app_sync_excludes) | map('regex_replace', '^', '--exclude=') | list }}"
  when: app_source_dir | length > 0
  notify: Reload apache

- name: Deploy the sample landing page
  ansible.builtin.template:
    src: index.php.j2
    dest: "{{ app_docroot }}/index.php"
    owner: root
    group: "{{ app_group }}"
    mode: "0640"
  when: app_source_dir | length == 0

# The playbook's post-task health check needs this whichever code is deployed.
- name: Deploy the health probe
  ansible.builtin.template:
    src: health.php.j2
    dest: "{{ app_docroot }}/health.php"
    owner: root
    group: "{{ app_group }}"
    mode: "0640"

- name: Install the sample schema
  ansible.builtin.copy:
    src: schema.sql
    dest: "{{ app_root }}/schema.sql"
    owner: root
    group: "{{ app_group }}"
    mode: "0640"
  notify: Load the sample schema
  when: app_source_dir | length == 0

- name: Check whether the application schema is loaded
  ansible.mysql.mysql_query:
    query: >-
      SELECT COUNT(*) AS tables_found FROM information_schema.tables
      WHERE table_schema = %s AND table_name = 'Users'
    positional_args:
      - "{{ db_name }}"
    login_unix_socket: "{{ mariadb_socket | default('/run/mysqld/mysqld.sock') }}"
  register: app_schema_state
  changed_when: false
  when: app_source_dir | length > 0 and app_schema_files | length > 0

# Imported only into an empty database, so re-runs never duplicate seed rows.
- name: Import the application schema
  ansible.mysql.mysql_db:
    name: "{{ db_name }}"
    state: import
    target: "{{ app_source_dir | regex_replace('/?$', '/') }}{{ item }}"
    login_unix_socket: "{{ mariadb_socket | default('/run/mysqld/mysqld.sock') }}"
  loop: "{{ app_schema_files }}"
  when:
    - app_schema_state is not skipped
    - app_schema_state.query_result[0][0].tables_found | int == 0
