---
- name: Reload apache
  ansible.builtin.service:
    name: apache2
    state: reloaded

- name: Load the sample schema
  ansible.mysql.mysql_db:
    name: "{{ db_name }}"
    state: import
    target: "{{ app_root }}/schema.sql"
    login_unix_socket: "{{ mariadb_socket | default('/run/mysqld/mysqld.sock') }}"
